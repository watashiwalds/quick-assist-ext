;; Preset cho llama-server router mode — 2 model trên 1 cổng (8080).
;; Yêu cầu llama.cpp build có router mode (khoảng cuối 2025 trở đi —
;; kiểm tra: `./llama-server --help | grep models-preset`).
;;
;; Cú pháp: mỗi section [tên-alias] = 1 model; tên section là giá trị dùng
;; cho trường "model" trong request /v1/chat/completions và /v1/embeddings.
;; Key dùng tên dài của flag, bỏ 2 gạch đầu: `ctx-size = 32768` ⇔ `--ctx-size 32768`.
;; Section [*] áp cho mọi model (model riêng override).
;; Lưu ý: phải là [*] — "[DEFAULT]" (chữ hoa) KHÔNG phải section global,
;; llama.cpp sẽ coi nó là một model tên "DEFAULT".

[*]
;; thread HTTP của router; model con tự override
threads-http = 8

[chat]
;; Model chat (GPU) — tương đương lệnh cũ: -c 32768 --parallel 1 -ngl 99 -ctk q8_0 -ctv q8_0 --jinja
model = /run/media/leedan5/ETC/AI_Models/prismml/Ternary-Bonsai-2-9B-PQ2_0-MTP-Q8_0.gguf
alias = chat
load-on-startup = true
; ctx-size = 32768
ctx-size = 8192
parallel = 1
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0
;; --jinja mặc định bật ở bản mới; giữ tường minh:
jinja = true
;; Tắt thinking/reasoning của model ngay từ server (không cần client gửi gì thêm):
reasoning = off

;; --- Tắt các lớp cache lưu lại giữa các request ---
;; prompt cache trong RAM host (mặc định 8192 MiB):
cache-ram = 0
;; context checkpoint (mặc định 32/slot, ~50 MiB mỗi cái):
;; lưu ý: model này dùng MTP/speculative decoding nên tắt checkpoint sẽ chậm hơn,
;; nhưng output không đổi. Nếu cần tốc độ, đổi thành 2.
ctx-checkpoints = 0
;; không tái dùng prompt giữa các request:
cache-prompt = false
;; không cất slot idle vào prompt cache:
cache-idle-slots = false
;; Muốn fidelity tối đa và đủ VRAM: đổi cache-type-k/v = f16 (tốn gấp đôi KV).

[embed]
;; Model embedding (CPU) — tương đương lệnh cũ:
;; --embeddings --pooling last -c 8192 --parallel 1 -ngl 0 -t 4 -ctk q8_0 -ctv q8_0 --jinja
model = /home/leedan5/Downloads/Qwen_Models/RAG/Qwen3-Embedding-0.6B-Q8_0.gguf
alias = embed
load-on-startup = true
embeddings = true
pooling = last
; ctx-size = 8192
ctx-size = 4096
parallel = 1
n-gpu-layers = 0
threads = 6
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
