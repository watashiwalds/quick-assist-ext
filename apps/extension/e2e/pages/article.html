    </style>

  <body>
    <h1>Kubernetes cho người mới</h1>
    <p id="p1">Pod là đơn vị triển khai nhỏ nhất trong Kubernetes. Deployment quản lý ReplicaSet để luôn đủ số Pod mong muốn và hỗ trợ rolling update không gián đoạn.</p>
    <p id="p2">Service cung cấp địa chỉ ổn định cho một nhóm Pod qua label selector; Ingress định tuyến HTTP theo tên miền.</p>
