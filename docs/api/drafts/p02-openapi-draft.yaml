openapi: 3.1.0
info:
  title: QuickAssist API
  version: 0.1.0-draft
  description: |
    Bản nháp hợp đồng P02. Base path là /api/v1. Quyết định thống nhất: tạo
    note chỉ dùng POST /notes; các tên /notes/quick và /notes/ragged đã bị loại.
servers:
  - url: http://localhost:8000/api/v1
    description: Development
security:
  - bearerAuth: []
paths:
  /auth/google/exchange:
    post:
      tags: [Authentication]
      summary: Đổi Google authorization code (Authorization Code + PKCE) lấy app session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleExchangeRequest'
      responses:
        '200':
          description: App session được phát hành.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/OAuthUpstream'
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Xoay vòng refresh token để lấy app access token mới
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  minLength: 1
                  writeOnly: true
      responses:
        '200':
          description: Cặp token mới; refresh token cũ bị thu hồi.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Thu hồi app session hiện tại
      responses:
        '204':
          description: Session đã bị thu hồi.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notes:
    post:
      tags: [Notes]
      summary: Tạo một note thuộc người dùng đang đăng nhập
      description: |
        Client phải tạo UUID mới cho Idempotency-Key cho mỗi thao tác tạo và giữ
        nguyên key khi retry do lỗi mạng/5xx. Cùng user + key + payload trả lại
        kết quả cũ; dùng lại key với payload khác trả 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Correlation ID do client cung cấp; server luôn trả X-Request-ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        '201':
          description: Note đã được lưu; lập chỉ mục AI có thể vẫn đang xử lý.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateOrQuotaLimited'
        '5XX':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: App access token ngắn hạn do QuickAssist phát hành, không phải Google token.
  headers:
    RequestId:
      description: ID tương quan để tra log; không chứa token hoặc nội dung note.
      schema:
        type: string
        format: uuid
  schemas:
    GoogleExchangeRequest:
      type: object
      additionalProperties: false
      required: [code, code_verifier, redirect_uri, state, nonce]
      properties:
        code:
          type: string
          minLength: 1
          description: Authorization code một lần từ Google.
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: PKCE verifier. Tên camelCase cũ trong SDS là codeVerifier.
        redirect_uri:
          type: string
          format: uri
          description: Redirect URI phải khớp cấu hình OAuth. Tên cũ là redirectUri.
        state:
          type: string
          minLength: 16
          description: Giá trị chống CSRF được extension kiểm tra trước khi gửi exchange.
        nonce:
          type: string
          minLength: 16
          description: Giá trị backend dùng khi xác minh ID token.
      description: |
        Backend xác minh issuer, audience, expiry, email_verified và nonce của ID token;
        scope Google tối thiểu là openid email profile. Không gửi Google client secret.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          writeOnly: true
        refresh_token:
          type: string
          writeOnly: true
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Thời gian sống access token tính bằng giây.
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    NoteCreateRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 50000
        folder_id:
          type: [string, 'null']
          format: uuid
          description: Nếu bỏ trống, backend dùng Inbox của người dùng hiện tại.
        source_url:
          type: [string, 'null']
          format: uri
          maxLength: 2048
        source_title:
          type: [string, 'null']
          maxLength: 512
      description: user_id không được nhận từ body; server lấy ownership từ bearer token.
    Note:
      type: object
      additionalProperties: false
      required: [id, content, index_status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        folder_id:
          type: [string, 'null']
          format: uuid
        source_url:
          type: [string, 'null']
          format: uri
        source_title:
          type: [string, 'null']
        index_status:
          type: string
          enum: [PROCESSING, READY, SKIPPED, FAILED]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
              format: uuid
              description: Tên camelCase cũ trong SDS là requestId.
  responses:
    Unauthorized:
      description: Token thiếu, sai, hết hạn hoặc refresh token đã bị reuse.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: { code: TOKEN_EXPIRED, message: Access token has expired, request_id: 0192a3bd-559b-7e5b-8c92-38f27cb59afb }
    Conflict:
      description: Idempotency key đã được dùng với payload khác.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: { code: IDEMPOTENCY_KEY_REUSED, message: Key was already used for a different request, request_id: 0192a3bd-559b-7e5b-8c92-38f27cb59afb }
    ValidationError:
      description: Field thiếu, sai kiểu hoặc vi phạm giới hạn; client không retry tự động.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Nội dung vượt giới hạn cho phép.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateOrQuotaLimited:
      description: Hết quota AI hoặc bị rate limit; UI hiển thị reason và không retry vô hạn.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: { code: QUOTA_EXCEEDED, message: AI quota exceeded, request_id: 0192a3bd-559b-7e5b-8c92-38f27cb59afb }
    OAuthUpstream:
      description: Google OAuth provider không sẵn sàng; retry có kiểm soát.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Lỗi backend/AI/network; client có thể retry có exponential backoff và jitter.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
