name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: quickassist_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/quickassist_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/api/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests migrations
      - name: Test (unit + architecture + integration với pgvector thật)
        run: pytest -q
      - name: Migration khớp model (không quên tạo migration)
        env: { DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/quickassist_test" }
        run: alembic upgrade head && alembic check

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/extension/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: quickassist-extension, path: apps/extension/dist }
