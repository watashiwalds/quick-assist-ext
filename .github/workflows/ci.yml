name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: quickassist_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/quickassist_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/api/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests migrations scripts
      - name: Test (unit + architecture + integration với pgvector thật + cổng chất lượng tìm kiếm H03)
        run: pytest -q
      - name: Migration khớp model + downgrade/upgrade được (A01)
        env: { DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/quickassist_test" }
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - name: Contract OpenAPI trong docs/api khớp code (P02)
        run: python scripts/export_openapi.py --check

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/extension/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Rà soát bundle trước phát hành (H01 — không secret/quyền thừa/hook kiểm thử)
        run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        with: { name: quickassist-extension, path: apps/extension/dist }

  e2e:
    # N07/C05/R05/H05 — extension thật trên Chromium + API + worker + PostgreSQL/pgvector (AI mock)
    runs-on: ubuntu-latest
    needs: [api, extension]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: quickassist }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/quickassist
      APP_ENV: dev
      ENABLE_DEV_LOGIN: "true"
      AI_PROVIDER: mock
      JWT_SECRET: ci-e2e-secret-0123456789-0123456789
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/quickassist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/api/pyproject.toml }
      - name: Khởi chạy API + worker
        working-directory: apps/api
        run: |
          pip install -e .
          alembic upgrade head
          nohup uvicorn quickassist.main:app --port 8000 > /tmp/api.log 2>&1 &
          nohup python -m quickassist.worker > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health/ready && break; sleep 1; done
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/extension/package-lock.json }
      - name: E2E (Playwright)
        working-directory: apps/extension
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/extension/playwright-report
            apps/extension/test-results
            /tmp/api.log
            /tmp/worker.log
